# Vercel Hobby rejasida cron faqat kuniga 1 marta ishlaydi, shuning uchun soatlik vazifalarni GitHub Actions chaqiradi.
# Sozlash: GitHub repo > Settings > Secrets and variables > Actions > Secrets:
#   SITE_URL     = https://sizning-sayt.vercel.app   (oxirida "/" bo'lmasin)
#   CRON_SECRET  = Vercel'dagi CRON_SECRET bilan bir xil qiymat
# welcome-cron (har daqiqa) GitHub'da ishlamaydi -> cron-job.org dan chaqiring (VERCEL.md, 5-bo'lim).
name: scheduled-bot-tasks
on:
  schedule:
    - cron: '0 * * * *'            # remind — har soat
    - cron: '10 5-7,14-17 * * *'   # streak-warn
    - cron: '5 19 * * 0'           # week-end — dushanba 00:05 (Toshkent): haftani yakunlash + TOP-20 ga xabar
  workflow_dispatch: {}            # qo'lda sinash: ikkalasini ham chaqiradi
jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Funksiyalarni chaqirish
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          [ -z "$SITE_URL" ] && { echo "::error::SITE_URL secret yo'q"; exit 1; }
          [ -z "$CRON_SECRET" ] && { echo "::error::CRON_SECRET secret yo'q"; exit 1; }
          call() {
            echo "-> $1"
            curl -fsS -m 55 --retry 2 --retry-delay 3 -H "Authorization: Bearer $CRON_SECRET" "${SITE_URL%/}/api/fn/$1"; echo
          }
          case "$SCHEDULE" in
            '0 * * * *')            call remind ;;
            '10 5-7,14-17 * * *')   call streak-warn ;;
            '5 19 * * 0')           call week-end ;;
            *)                      call remind; call streak-warn ;;
          esac
